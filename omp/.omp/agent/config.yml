modelRoles:
  default: opencode-go/deepseek-v4.1-flash
symbolPreset: unicode-noemoji
composer:
  shape: claude
  tokenRate: true
theme:
  dark: zenburn
update:
  auto: false
setupVersion: 3
tui:
  vimMode: true
spelling:
  autocomplete: "off"
hideThinkingBlock: true
defaultThinkingLevel: auto
telemetry:
  otlpExportEnabled: false
secrets:
  enabled: true
dev:
  autoqa: false
title:
  icons: boring
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - context_pct
    - cache_hit
    - cost
  rightSegments:
    - collab
    - stream
    - session_name
    - git
    - pr
  transparent: true
  compactThinkingLevel: false
